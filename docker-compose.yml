version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  cassandra:
    image: cassandra:4.1
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=TallerCluster

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474" # Interfaz web
      - "7687:7687" # Protocolo Bolt
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["graph-data-science"] # Para Louvain/PageRank

  spark:
    image: apache/spark:3.5.1-python3
    container_name: spark_master
    user: root  # Necesario para evitar problemas de permisos con los volúmenes
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080" # Interfaz web
      - "7077:7077" # Puerto del Master
    volumes:
      - ./:/app  # Monta tu carpeta actual
    working_dir: /app

  spark-worker:
    image: apache/spark:3.5.1-python3
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark:7077
    depends_on:
      - spark
    volumes:
      - ./:/app
    working_dir: /app